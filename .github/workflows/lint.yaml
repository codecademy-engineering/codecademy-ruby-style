name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint the app
    runs-on: ubuntu-24.04 # CCINFRA-13282: Ubuntu 26.04 breaks Ruby 2.7.1; remove in Phase 5

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Ruby 
      uses: ruby/setup-ruby@v1 # no need for ruby-version because we have a .ruby_version file
      with:
          bundler-cache: true
  
    - name: Run Rubocop
      run: bundle exec rubocop --config ./.rubocop.yml
