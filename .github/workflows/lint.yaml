name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint the app
    runs-on: ubuntu-24.04 # CCINFRA-13282: Ubuntu 26.04 breaks Ruby 2.7.1; remove in Phase 5

    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

    - name: Setup Ruby 
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
          bundler-cache: true
  
    - name: Run Rubocop
      run: bundle exec rubocop --config ./.rubocop.yml
